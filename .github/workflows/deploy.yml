# CMS 项目 CI/CD 工作流
# 触发条件: push 到 main 分支，或手动在 Actions 页面点 "Run workflow"
name: Deploy CMS

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 手动触发，方便随时部署

# 同一时间只跑一个部署任务，避免并发冲突
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  # 服务器上的部署路径（宝塔默认 /www/wwwroot/cms）
  DEPLOY_PATH: /www/wwwroot/cms

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ============ 1. 拉代码 ============
      - name: Checkout
        uses: actions/checkout@v4

      # ============ 2. 构建后端 jar ============
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend
        working-directory: ./backend
        run: mvn package -DskipTests -B

      - name: Verify jar
        run: ls -lh backend/target/cms-backend-1.0.0.jar

      # ============ 3. 构建前端 dist ============
      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Verify dist
        run: ls -la frontend/dist/index.html

      # ============ 4. 部署到服务器 ============
      # 4.1 上传后端 jar
      - name: Upload Backend jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "backend/target/cms-backend-1.0.0.jar"
          target: "${{ env.DEPLOY_PATH }}/backend/"
          strip_components: 2  # 去掉 backend/target/ 前缀，直接传 jar 到目标目录

      # 4.2 上传前端 dist（用 rsync 增量传输，只传变化的文件）
      - name: Upload Frontend dist
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          SOURCE: "frontend/dist/"
          TARGET: "${{ env.DEPLOY_PATH }}/frontend/dist/"
          ARGS: "-avz --delete"

      # 4.3 重启后端服务
      # 如果用 systemd（推荐），取消注释下面这段
      # 如果用宝塔 Java 项目管理器，用方式 B
      - name: Restart Backend Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # ===== 方式 A: systemd（推荐，自动拉起） =====
            systemctl restart cms-backend
            sleep 3
            systemctl is-active cms-backend && echo "Backend restarted OK" || echo "Backend FAILED"

            # ===== 方式 B: 宝塔 Java 项目管理器 =====
            # 如果没用 systemd 而是用宝塔面板的 Java 项目管理器，
            # 把上面两行注释掉，取消注释下面这行（项目名换成你在宝塔里创建的）
            # bt site restart cms-backend

      # 4.4 部署后健康检查
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            for i in $(seq 1 12); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/v1/auth/login 2>/dev/null || true)
              if [ "$HTTP_CODE" = "405" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "200" ]; then
                echo "Health check PASSED (HTTP $HTTP_CODE)"
                exit 0
              fi
              echo "Waiting for backend... ($i/12, HTTP $HTTP_CODE)"
              sleep 5
            done
            echo "Health check FAILED (HTTP $HTTP_CODE)"
            journalctl -u cms-backend --no-pager -n 30
            exit 1
